; ============================================================
; Pool: notifications
; Handles: notifications (email, SMS, push)
;
; Design rationale
; ────────────────
; • Notifications are critical customer-facing jobs.
; • 2 workers ensure newsletter sends and alerts don't queue.
; • Slightly lower priority than realtime but higher than PDFs.
; ============================================================

[program:laravel-worker-notifications]

; ── Identity ─────────────────────────────────────────────────────────────────
process_name = %(program_name)s_%(process_num)02d
user         = forge

; ── Command ──────────────────────────────────────────────────────────────────
; Handles: notifications queue
; Timeouts set for email sending (can be 30+ seconds for large attachments).
command = php /var/www/html/artisan queue:work redis \
    --queue=notifications \
    --sleep=3 \
    --tries=3 \
    --backoff=10,60 \
    --timeout=120 \
    --max-time=3600 \
    --max-jobs=500

; ── Scaling ──────────────────────────────────────────────────────────────────
numprocs = 2

; ── Restart policy ───────────────────────────────────────────────────────────
autostart     = true
autorestart   = true
startretries  = 5
startsecs     = 2

; ── Signal handling ──────────────────────────────────────────────────────────
stopasgroup   = true
killasgroup   = true
stopwaitsecs  = 120

; ── Priority ─────────────────────────────────────────────────────────────────
; Start after realtime/default, before PDFs.
priority = 200

; ── Logging ──────────────────────────────────────────────────────────────────
redirect_stderr          = true
stdout_logfile           = /var/www/html/storage/logs/worker-notifications.log
stdout_logfile_maxbytes  = 50MB
stdout_logfile_backups   = 5

; ── Environment passthrough ───────────────────────────────────────────────────
environment = APP_ENV="%(ENV_APP_ENV)s"
