; ============================================================
; Supervisor master configuration
; Path: /etc/supervisor/supervisord.conf  (or include from there)
;
; This file is the entry point. It defines the [unix_http_server],
; [supervisord], [rpcinterface], and [supervisorctl] sections and
; then includes the per-pool configs from the same directory.
;
; INSTALLATION
; ─────────────
;   sudo apt install supervisor
;   sudo cp deploy/supervisor/*.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start all
; ============================================================

[unix_http_server]
file = /var/run/supervisor.sock
chmod = 0700
; Restrict socket access to the deploy user only.
chown = root:forge

[supervisord]
logfile          = /var/log/supervisor/supervisord.log
logfile_maxbytes = 50MB
logfile_backups  = 5
loglevel         = info
pidfile          = /var/run/supervisord.pid
; Do NOT run as root long-term; drop to a less-privileged user.
nodaemon         = false
minfds           = 1024
minprocs         = 200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

; ── Include all pool configs ──────────────────────────────────────────────────
; Each [program:…] block lives in its own file so adding a new queue pool
; only requires adding one file + supervisorctl reread && update.
[include]
files = /etc/supervisor/conf.d/*.conf
