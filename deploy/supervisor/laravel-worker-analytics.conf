; ============================================================
; Pool: analytics
; Handles: analytics, reporting, aggregations, data syncs
;
; Design rationale
; ────────────────
; • Analytics jobs are background-priority (non-blocking).
; • 1 worker is sufficient; reporting happens during off-peak.
; • Can be longer timeout for multi-step aggregations.
; • Lowest priority; can wait during peak traffic.
; ============================================================

[program:laravel-worker-analytics]

; ── Identity ─────────────────────────────────────────────────────────────────
process_name = %(program_name)s_%(process_num)02d
user         = forge

; ── Command ──────────────────────────────────────────────────────────────────
; Handles: analytics queue
; Longer timeout (240s) for multi-step aggregations.
command = php /var/www/html/artisan queue:work redis \
    --queue=analytics \
    --sleep=5 \
    --tries=2 \
    --backoff=60,300 \
    --timeout=240 \
    --max-time=3600 \
    --max-jobs=50

; ── Scaling ──────────────────────────────────────────────────────────────────
numprocs = 1

; ── Restart policy ───────────────────────────────────────────────────────────
autostart     = true
autorestart   = true
startretries  = 5
startsecs     = 2

; ── Signal handling ──────────────────────────────────────────────────────────
stopasgroup   = true
killasgroup   = true
stopwaitsecs  = 240

; ── Priority ─────────────────────────────────────────────────────────────────
; Start last; lowest priority.
priority = 400

; ── Logging ──────────────────────────────────────────────────────────────────
redirect_stderr          = true
stdout_logfile           = /var/www/html/storage/logs/worker-analytics.log
stdout_logfile_maxbytes  = 50MB
stdout_logfile_backups   = 5

; ── Environment passthrough ───────────────────────────────────────────────────
environment = APP_ENV="%(ENV_APP_ENV)s"
