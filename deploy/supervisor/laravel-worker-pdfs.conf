; ============================================================
; Pool: pdfs
; Handles: PDF generation, reports, exports
;
; Design rationale
; ────────────────
; • PDF generation can be CPU-intensive and slower.
; • 1 worker is sufficient; reports are not time-critical.
; • Longer timeout to accommodate large report rendering.
; • Lower priority than notifications.
; ============================================================

[program:laravel-worker-pdfs]

; ── Identity ─────────────────────────────────────────────────────────────────
process_name = %(program_name)s_%(process_num)02d
user         = forge

; ── Command ──────────────────────────────────────────────────────────────────
; Handles: pdfs queue
; Timeout set to 180s for large/complex PDF rendering.
command = php /var/www/html/artisan queue:work redis \
    --queue=pdfs \
    --sleep=3 \
    --tries=2 \
    --backoff=30,120 \
    --timeout=180 \
    --max-time=3600 \
    --max-jobs=100

; ── Scaling ──────────────────────────────────────────────────────────────────
numprocs = 1

; ── Restart policy ───────────────────────────────────────────────────────────
autostart     = true
autorestart   = true
startretries  = 5
startsecs     = 2

; ── Signal handling ──────────────────────────────────────────────────────────
stopasgroup   = true
killasgroup   = true
stopwaitsecs  = 180

; ── Priority ─────────────────────────────────────────────────────────────────
; Start after notifications, before analytics.
priority = 300

; ── Logging ──────────────────────────────────────────────────────────────────
redirect_stderr          = true
stdout_logfile           = /var/www/html/storage/logs/worker-pdfs.log
stdout_logfile_maxbytes  = 50MB
stdout_logfile_backups   = 5

; ── Environment passthrough ───────────────────────────────────────────────────
environment = APP_ENV="%(ENV_APP_ENV)s"
