; ============================================================
; Pool: emails
; Handles: transactional mail, order confirmations, invoices
;
; Design rationale
; ────────────────
; • Dedicated pool so a mail-server slowdown never blocks
;   payment jobs or real-time broadcast events.
; • 2 processes is enough for throughput; raise to 4 if the
;   emails queue depth consistently exceeds ~500 jobs.
; • --max-time and --max-jobs ensure PHP memory does not
;   balloon over a long run. See docs/worker-supervision.md.
; ============================================================

[program:laravel-worker-emails]

; ── Identity ─────────────────────────────────────────────────────────────────
process_name = %(program_name)s_%(process_num)02d
; Run as the web server user so file-system permissions match.
; Change to 'ubuntu' / 'deploy' / 'www-data' to match your server.
user         = forge

; ── Command ──────────────────────────────────────────────────────────────────
; Full absolute path to php + artisan.  Never rely on $PATH inside Supervisor.
;
; --queue=emails          Only drain the emails queue (no cross-pool bleed).
; --sleep=3               Poll interval when the queue is empty (seconds).
; --tries=3               Retry a failing job 3 times before sending to failed_jobs.
; --backoff=5             Wait 5 s between each retry attempt.
; --timeout=60            Kill a job that runs longer than 60 s (alarm signal).
; --max-time=3600         The worker exits cleanly after 3 600 s (1 hour).
;                         Supervisor restarts it immediately.
;                         Reason: prevents PHP memory leaks from accumulating over
;                         hours of continuous running. Fresh start = known-good state.
; --max-jobs=1000         Exit after processing 1 000 jobs, whichever comes first.
;                         Reason: Laravel apps often load class definitions on first
;                         use. After many jobs the heap is peppered with objects that
;                         will never be GC'd. Recycling caps peak RSS.
command = php /var/www/html/artisan queue:work redis \
    --queue=emails \
    --sleep=3 \
    --tries=3 \
    --backoff=5 \
    --timeout=60 \
    --max-time=3600 \
    --max-jobs=1000

; ── Scaling ──────────────────────────────────────────────────────────────────
; Number of identical worker processes to spawn.
; Tune based on: queue depth × avg job duration ÷ acceptable latency.
numprocs = 2

; ── Restart policy ───────────────────────────────────────────────────────────
autostart     = true    ; Start automatically when supervisord starts.
autorestart   = true    ; Restart if the process exits for any reason.
startretries  = 5       ; Try to start 5 times before giving up.
startsecs     = 2       ; Consider the program "started" if it runs for 2 s.

; ── Signal handling ──────────────────────────────────────────────────────────
; These two settings ensure the signal is sent to the entire process group,
; so child processes spawned by the worker also receive SIGTERM cleanly.
stopasgroup   = true
killasgroup   = true
; Give the worker this many seconds to finish its current job before SIGKILL.
; Must be >= --timeout to avoid killing a job mid-run.
stopwaitsecs  = 60

; ── Priority ─────────────────────────────────────────────────────────────────
; Lower number = started earlier. emails < default so mail starts first.
priority = 200

; ── Logging ──────────────────────────────────────────────────────────────────
redirect_stderr       = true
stdout_logfile        = /var/www/html/storage/logs/worker-emails.log
; Rotate at 50 MB; keep 5 backups so you have ~250 MB of history.
stdout_logfile_maxbytes  = 50MB
stdout_logfile_backups   = 5

; ── Environment passthrough ───────────────────────────────────────────────────
; Supervisor does NOT inherit the shell environment by default.
; Passing APP_ENV allows queue:work to bootstrap the correct config cache.
environment = APP_ENV="%(ENV_APP_ENV)s"
