; ============================================================
; Pool: default
; Handles: default, realtime (broadcasts), slack, webhooks
;
; Design rationale
; ────────────────
; • This is the highest-priority pool; it runs 4 processes so
;   real-time broadcast events land in the browser with sub-
;   second latency.
; • The queue priority list is: realtime first, then default,
;   then slack/webhooks.  Workers poll each queue in order and
;   drain the higher-priority queue before moving down.
; • More numprocs than emails because these jobs are shorter
;   and the real-time queue must never back up.
; ============================================================

[program:laravel-worker-default]

; ── Identity ─────────────────────────────────────────────────────────────────
process_name = %(program_name)s_%(process_num)02d
user         = forge

; ── Command ──────────────────────────────────────────────────────────────────
; Queue priority order matches the p queue:work call in dev:
;   realtime  → broadcast events (OrderPlaced, etc.)
;   default   → general background work (GenerateInvoicePdf, etc.)
;   slack     → Slack notifications
;   webhooks  → outbound webhook POSTs
;
; --timeout must be long enough for the longest expected job.
;   GenerateInvoicePdf can take ~10 s; 90 s gives ample headroom.
;
; --max-time=3600
;   Workers restart hourly regardless of job count.
;   WHY: PHP is a long-running process when used as a worker.
;   Over hours, memory fragmentation, cached class maps, open
;   sockets, and static singletons all accumulate. The 1-hour
;   ceiling caps worst-case RSS growth and keeps each process
;   in a predictable, tested state.
;
; --max-jobs=1000
;   Workers restart after 1 000 jobs, whichever limit is hit first.
;   WHY: Some jobs allocate large data structures (CSV exports,
;   image processing). GC cannot always reclaim all of that memory.
;   Recycling after a fixed count prevents a single worker from
;   consuming several gigabytes of RAM over a busy hour.
command = php /var/www/html/artisan queue:work redis \
    --queue=realtime,default,slack,webhooks \
    --sleep=3 \
    --tries=3 \
    --backoff=10 \
    --timeout=90 \
    --max-time=3600 \
    --max-jobs=1000

; ── Scaling ──────────────────────────────────────────────────────────────────
; 4 workers handle burst broadcast events without queuing delay.
; Scale up if `queue:monitor redis:realtime` shows depth > ~200.
numprocs = 4

; ── Restart policy ───────────────────────────────────────────────────────────
autostart     = true
autorestart   = true
startretries  = 5
startsecs     = 2

; ── Signal handling ──────────────────────────────────────────────────────────
; stopasgroup + killasgroup ensure signals propagate to the whole process tree.
; stopwaitsecs must be >= --timeout (90 s) so a running job finishes cleanly.
stopasgroup   = true
killasgroup   = true
stopwaitsecs  = 90

; ── Priority ─────────────────────────────────────────────────────────────────
; Start before emails (lower number = earlier start).
priority = 100

; ── Logging ──────────────────────────────────────────────────────────────────
redirect_stderr          = true
stdout_logfile           = /var/www/html/storage/logs/worker-default.log
stdout_logfile_maxbytes  = 50MB
stdout_logfile_backups   = 5

; ── Environment passthrough ───────────────────────────────────────────────────
environment = APP_ENV="%(ENV_APP_ENV)s"
